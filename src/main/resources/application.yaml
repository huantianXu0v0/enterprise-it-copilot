spring:
  application:
    name: enterprise-it-copilot
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/ragent?client_encoding=UTF8
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      connect-timeout: 2s
      timeout: 2s
      password: 123456

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.xht.itcopilot.mapper: info
    com.xht.itcopilot.service: info


rag:
  memory:
    trigger-turns: 10
    keep-turns: 5
    max-summary-chars: 4000
    max-prompt-chars: 60000
  storage:
    kb-bucket: rag-it-source
    s3:
      endpoint: http://localhost:9000
      access-key: rustfsadmin
      secret-key: rustfsadmin

  chat-executor:
    core-size: 4
    max-size: 8
    queue-capacity: 8
    keep-alive-seconds: 60

server:
  port: 1001

ai:
  embedding:
    url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
    api-key: ${embed-key}
    model: text-embedding-v4
    dimensions: 1536

  chat:
    url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    api-key: ${chat-key}
    model: qwen-plus

mcp:
  server-url: http://localhost:1002
  endpoint: /mcp